<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例卡片页面</title>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="你想显示的标题" />
  <meta name="twitter:description" content="这里是卡片描述内容，140 字以内。" />
  <meta name="twitter:image" content="https://pbs.twimg.com/profile_images/1986634346833321984/hkJ_gJzT_400x400.jpg" />

  <!-- Open Graph (Optional but recommended) -->
  <meta property="og:title" content="你想显示的标题" />
  <meta property="og:description" content="这里是卡片描述内容，140 字以内。" />
  <meta property="og:image" content="https://pbs.twimg.com/profile_images/1986634346833321984/hkJ_gJzT_400x400.jpg" />
  <meta property="og:type" content="website" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #fafafa;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
    }
    p {
      color: #333;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://example.com/your-image.jpg" alt="preview" />
    <h1>你想显示的标题</h1>
    <p>这是你的落地页正文内容，你可以在这里放任何说明、按钮、下载链接、活动介绍等等。</p>
  </div>
</body>
</html>
